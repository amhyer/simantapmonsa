name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Dipakai untuk menempelkan ringkasan log bila instalasi gagal.
  pull-requests: write

jobs:
  phpunit:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, zip, xml, intl, gmp, dom, fileinfo, iconv, curl
          coverage: none
          tools: composer:v2
          ini-values: sys_temp_dir=/tmp

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # .env dibuat SEBELUM composer install supaya skrip post-autoload-dump
      # (artisan package:discover) tidak bergantung pada env yang belum ada.
      - name: Siapkan .env
        run: cp .env.example .env

      # composer.lock menyimpan dist URL berbentuk
      # https://api.github.com/repos/<owner>/<repo>/zipball/<sha>.
      # Tanpa token, unduhan itu memakai kuota anonim 60 permintaan/jam per IP
      # dan runner GitHub berbagi IP -> "API rate limit exceeded".
      # COMPOSER_AUTH menaikkan kuota ke 5.000/jam dan menghindari kegagalan.
      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          set -o pipefail
          composer install --no-interaction --prefer-dist --no-progress 2>&1 \
            | tee /tmp/composer-install.log

      - name: Generate app key
        run: php artisan key:generate

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run test suite (wajib hijau)
        run: php artisan test --exclude-group baseline

      # Test baseline (AuditCbtProofTest, RouteHealthAuditTest) sengaja MERAH
      # sampai Fase 1-2 selesai. Dijalankan sebagai laporan, tidak memblokir CI.
      - name: Laporan baseline (tidak memblokir)
        if: always()
        continue-on-error: true
        run: php artisan test --group baseline

      - name: Simpan laporan endpoint 5xx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-health-report
          path: storage/logs/route-health-report.txt
          if-no-files-found: ignore

      # Log runner Actions hanya bisa diunduh lewat blob storage; beberapa
      # jaringan/agen tidak bisa membukanya. Menempelkan potongan log ke PR
      # membuat kegagalan tetap terbaca dari mana saja.
      - name: Tempel log kegagalan ke PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "CI \`Tests\` gagal. Potongan log diagnostik:"
            echo
            echo '```'
            php -v 2>&1 | head -2 || true
            echo
            composer --version 2>&1 | head -2 || true
            echo
            echo "--- composer-install.log (100 baris terakhir) ---"
            tail -n 100 /tmp/composer-install.log 2>/dev/null || echo "(log tidak tersedia)"
            echo '```'
          } > /tmp/ci-report.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ci-report.md
